[pytest]
# Pytest configuration for MIPkit

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for multiple components
    slow: Tests that take a long time to run
    requires_rdkit: Tests that require RDKit to be installed
    requires_external: Tests that require external tools (gmx, obabel, etc)

# Coverage options
[coverage:run]
source = MIPkit
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
