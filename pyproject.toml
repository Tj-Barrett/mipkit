[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MIPkit"
readme = "README.md"
version = "2026.7"
description = "A Python package for screening, precomplexation, and complexation of Molecularly Imprinted Polymers"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    { name = "Thomas J. Barrett", email = "tbar@tf.uni-kiel.de" },
]
keywords = [
    "autodock",
    "polymers",
    "proteins",
    "molecular-imprinting",
    "computational-chemistry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "setuptools",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "rich>=10.0.0",
    "rdkit>=2022.03.1",
    "pyyaml>=5.4.0",
    "seaborn>=0.11.0",
    "networkx>=2.6.0",
    "pyqt5>=5.15.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.1.0",
    # Code quality
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pylint>=2.17.0",
    "isort>=5.12.0",
    # Coverage
    "coverage[toml]>=7.0.0",
    "coverage-badge>=1.1.0",
    # Documentation
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    # Development tools
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.19.0",
]

[project.scripts]
MIPkit = "MIPkit:__main__.main"
MIPkit-gui = "MIPkit:__gui__.main"

[project.urls]
Homepage = "https://github.com/tj-barrett/bmbt-mipkit"

[tool.setuptools]
package-data = {"*" = ["*"]}
packages = ["MIPkit"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for multiple components",
    "slow: Tests that take a long time to run",
    "requires_rdkit: Tests that require RDKit to be installed",
    "requires_external: Tests that require external tools (gmx, obabel, etc)",
]

[tool.coverage.run]
source = ["MIPkit"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["MIPkit"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
]
ignore_missing_imports = true
